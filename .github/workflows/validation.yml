
name: Website validation

on:
  push:
    branches:
      - main

jobs:
  validate:
    name: Check project files and JavaScript
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v5

      - name: Check required files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          test -f package.json
          test -f eslint.config.js
          echo "All required files are present."

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint
